[project]
name = "dc"
version = "0.1.0"
description = "Hosted Discord music bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py[voice]>=2.7.1",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "websockets>=12.0",
    "pycryptodome>=3.23.0",
    "pynacl>=1.5.0",
    "davey>=0.0.3",
    "discord-ext-voice-recv>=0.5.2a179",
    "yt-dlp>=2026.6.9",
    "paramiko>=5.0.0",
    # yt-dlp client plugin for the bgutil PO Token provider. The Node POT
    # server is started by run_windows.bat / setup.sh on port 4416, but yt-dlp
    # cannot use it without this plugin installed. Must stay declared here or
    # `uv sync` prunes it and YouTube extraction silently degrades to the
    # slow, throttled, frequently-failing no-PO-token path.
    "bgutil-ytdlp-pot-provider>=1.3.1",
]
